<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Realistic Hanging Whiteboard</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    :root {
      --bg-wall: #f1ebd9;
      --board-tint: #fdf8ec;
      --board-grid: rgba(215, 190, 150, 0.45);
      --green-slab: #25a266;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-wall);
      background-image:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,0.85) 0%, transparent 68%),
        radial-gradient(rgba(160, 140, 120, 0.16) 1.2px, transparent 0);
      background-size: 100% 100%, 30px 30px;
    }

    .whiteboard-surface {
      background-color: var(--board-tint);
      background-image:
        linear-gradient(var(--board-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--board-grid) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: -1px -1px;
    }

    .board-rig {
      transform-origin: 50% -240px;
      transition: transform 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.05);
    }

    .green-backing-slab {
      background-color: var(--green-slab);
      border-radius: 6px;
      box-shadow: 0 45px 80px -15px rgba(12, 60, 36, 0.44);
    }

    .aluminum-tray {
      background: linear-gradient(180deg, #eae5dc 0%, #cac2b2 20%, #9e9381 70%, #7d7260 100%);
      border-top: 1.5px solid #fff;
      border-bottom: 2.5px solid #3c3429;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.7), 0 8px 20px rgba(0,0,0,0.3);
    }

    .braided-cord {
      background: repeating-linear-gradient(
        45deg,
        #49392b 0px,
        #49392b 4px,
        #796048 4px,
        #796048 8px
      );
      box-shadow: 2px 4px 8px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body class="flex flex-col justify-center items-center h-full">

  <!-- TOP WALL MOUNT & BRAIDED CORDS -->
  <div class="relative w-full max-w-5xl flex justify-center pt-4 z-0 pointer-events-none">
    <div class="absolute -top-1 z-20 flex flex-col items-center">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-amber-200 via-amber-600 to-amber-900 border-2 border-stone-800 shadow-xl flex items-center justify-center">
        <div class="w-3 h-3 rounded-full bg-stone-900 shadow-inner"></div>
      </div>
      <div class="w-4 h-6 bg-amber-700 -mt-1 rounded-b-md shadow-md"></div>
    </div>
    <div class="w-[3px] h-36 braided-cord absolute top-3 left-[34%] -rotate-[23deg] origin-top"></div>
    <div class="w-[3px] h-36 braided-cord absolute top-3 right-[34%] rotate-[23deg] origin-top"></div>
  </div>

  <!-- MAIN RIG: HANGING WHITEBOARD WITH GREEN OFFSET SLAB -->
  <div id="boardRig" class="board-rig relative w-full max-w-[1060px] my-6">

    <!-- 1. GREEN OFFSET BACKING SLAB -->
    <div class="absolute inset-0 green-backing-slab translate-x-6 translate-y-7 rotate-[-1.2deg] pointer-events-none"></div>

    <!-- 2. MAIN WHITEBOARD FRAME (Tilted -1.8deg) -->
    <div id="whiteboardFrame" class="relative z-10 w-full bg-[#fdf8ec] border-[2.8px] border-[#161616] rounded-[6px] shadow-[0_24px_50px_rgba(20,20,20,0.24)] rotate-[-1.8deg] overflow-hidden">

      <!-- TOP STATUS / WINDOW BAR -->
      <div class="border-b-[2px] border-[#161616]/80 px-6 py-2.5 flex items-center justify-between bg-[#fdf8ec]/95 backdrop-blur-sm z-30 relative select-none">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-[#25a266] border border-[#145d39]"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#3c3c3c] border border-black/40"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#cb564b] border border-black/30"></span>
        </div>

        <div class="text-sm font-semibold text-[#272420] tracking-tight">
          Untitled system / 04
        </div>

        <div class="flex items-center gap-1.5">
          <span class="text-[13px] font-bold text-[#25a266] flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-[#25a266] animate-pulse"></span>
            Saved
          </span>
        </div>
      </div>

      <!-- WHITEBOARD WORKSPACE -->
      <div id="boardCanvasContainer" class="whiteboard-surface relative w-full h-[590px] overflow-hidden flex items-center justify-center">
        <span class="text-stone-400 font-mono text-xs">Diagram Preview Nodes...</span>
      </div>

      <!-- 3. REALISTIC PHYSICAL BOTTOM ALUMINUM TRAY -->
      <div class="aluminum-tray h-20 px-8 flex items-center justify-between relative z-30">
        <div class="flex items-center gap-7 py-2">
          <div class="w-32 h-6 rounded-sm bg-gradient-to-r from-stone-950 via-stone-800 to-stone-900 border border-black shadow-md relative overflow-hidden"></div>
          <div class="w-32 h-6 rounded-sm bg-gradient-to-r from-stone-950 via-stone-800 to-stone-900 border border-black shadow-md relative overflow-hidden"></div>
          <div class="w-32 h-6 rounded-sm bg-gradient-to-r from-stone-950 via-stone-800 to-stone-900 border border-black shadow-md relative overflow-hidden"></div>
          <div class="w-32 h-6 rounded-sm bg-gradient-to-r from-stone-950 via-stone-800 to-stone-900 border border-black shadow-md relative overflow-hidden"></div>
          <div class="w-32 h-9 rounded-[4px] border-[1.5px] border-black/80 bg-[#1e1e1e]"></div>
        </div>

        <div class="flex items-center gap-3">
          <button class="px-3.5 py-1.5 rounded-md bg-stone-200 text-stone-800 text-xs font-bold border border-stone-400">Wipe All</button>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
